<!DOCTYPE html>
<html>

<head>
  <title>Room | StudyHub</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1c1b2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: #eeedf8;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 25%, rgba(124, 111, 255, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 75%, rgba(168, 85, 247, 0.14) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Floating study icons ── */
    .study-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .study-bg span {
      position: absolute;
      display: block;
      opacity: 0.28;
      animation: floatIcon linear infinite;
      user-select: none;
      filter: saturate(0.6) brightness(1.3);
    }

    .study-bg span:nth-child(1) {
      left: 4%;
      top: 7%;
      font-size: 38px;
      animation-duration: 18s;
      animation-delay: 0s;
    }

    .study-bg span:nth-child(2) {
      left: 13%;
      top: 63%;
      font-size: 26px;
      animation-duration: 22s;
      animation-delay: -4s;
    }

    .study-bg span:nth-child(3) {
      left: 24%;
      top: 27%;
      font-size: 22px;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    .study-bg span:nth-child(4) {
      left: 41%;
      top: 77%;
      font-size: 34px;
      animation-duration: 20s;
      animation-delay: -2s;
    }

    .study-bg span:nth-child(5) {
      left: 57%;
      top: 11%;
      font-size: 30px;
      animation-duration: 25s;
      animation-delay: -6s;
    }

    .study-bg span:nth-child(6) {
      left: 68%;
      top: 56%;
      font-size: 24px;
      animation-duration: 19s;
      animation-delay: -10s;
    }

    .study-bg span:nth-child(7) {
      left: 78%;
      top: 31%;
      font-size: 36px;
      animation-duration: 23s;
      animation-delay: -3s;
    }

    .study-bg span:nth-child(8) {
      left: 88%;
      top: 71%;
      font-size: 28px;
      animation-duration: 17s;
      animation-delay: -7s;
    }

    .study-bg span:nth-child(9) {
      left: 92%;
      top: 17%;
      font-size: 22px;
      animation-duration: 21s;
      animation-delay: -1s;
    }

    .study-bg span:nth-child(10) {
      left: 8%;
      top: 88%;
      font-size: 32px;
      animation-duration: 24s;
      animation-delay: -5s;
    }

    .study-bg span:nth-child(11) {
      left: 50%;
      top: 47%;
      font-size: 20px;
      animation-duration: 15s;
      animation-delay: -9s;
    }

    .study-bg span:nth-child(12) {
      left: 32%;
      top: 4%;
      font-size: 26px;
      animation-duration: 20s;
      animation-delay: -11s;
    }

    @keyframes floatIcon {
      0% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }

      30% {
        transform: translateY(-18px) rotate(6deg) scale(1.05);
      }

      65% {
        transform: translateY(-7px) rotate(-4deg) scale(0.97);
      }

      100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(124, 111, 255, 0.18);
      border-radius: 28px;
      padding: 56px 52px 52px;
      width: 100%;
      max-width: 620px;
      text-align: center;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(124, 111, 255, 0.10),
        0 40px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(36px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── Room badge ── */
    .room-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      border-radius: 100px;
      background: rgba(124, 111, 255, 0.12);
      border: 1px solid rgba(124, 111, 255, 0.22);
      color: #a78bfa;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      animation: pillIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    @keyframes pillIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Heading ── */
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
      animation: pillIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.42);
      font-size: 15px;
      margin-bottom: 44px;
      animation: pillIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    /* ── Action cards ── */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px 28px;
      border-radius: 20px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.25s ease,
        filter 0.25s ease;
      overflow: hidden;
      min-width: 180px;
    }

    .btn-icon {
      font-size: 36px;
      display: block;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover .btn-icon {
      transform: scale(1.2) rotate(-5deg);
    }

    .btn:active {
      transform: scale(0.96) !important;
    }

    /* Shine sweep */
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transition: left 0.45s ease;
    }

    .btn:hover::before {
      left: 160%;
    }

    /* Join Conference */
    .btn-primary {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      animation: pillIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .btn-primary:hover {
      transform: translateY(-6px) scale(1.03);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    /* Notes */
    .btn-secondary {
      background: linear-gradient(135deg, #7c6fff 0%, #a855f7 100%);
      color: #fff;
      box-shadow: 0 8px 28px rgba(124, 111, 255, 0.40);
      animation: pillIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
    }

    .btn-secondary:hover {
      transform: translateY(-6px) scale(1.03);
      filter: brightness(1.12);
      box-shadow: 0 18px 44px rgba(124, 111, 255, 0.52);
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 36px;
      color: rgba(255, 255, 255, 0.28);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .back-link:hover {
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>

<body>

  <div class="study-bg">
    <span>📚</span><span>✏️</span><span>💡</span><span>🎓</span>
    <span>📝</span><span>🔬</span><span>📐</span><span>🖊️</span>
    <span>📓</span><span>⚗️</span><span>🧮</span><span>📏</span>
  </div>

  <div class="card">

    <div class="room-badge">🏠 Room Dashboard</div>

    <h1>What do you want to do?</h1>
    <p class="subtitle">Choose an activity to get started in your room</p>

    <div class="buttons">
      <button class="btn btn-primary" onclick="joinConference()">
        <span class="btn-icon">🎥</span>
        Join Conference
      </button>

      <button class="btn btn-secondary" onclick="openNotes()">
        <span class="btn-icon">📝</span>
        Notes
      </button>
    </div>

    <div onclick="history.back()" class="back-link">← Back to dashboard</div>

  </div>

  <script>
    const roomId = new URLSearchParams(window.location.search).get("roomId");

    if (!roomId) {
      alert("Invalid room");
      window.location.href = "dashboard.html";
    }

    function joinConference() {
      window.location.href = `conference.html?roomId=${roomId}`;
    }

    function openNotes() {
      window.location.href = `notes.html?roomId=${roomId}`;
    }
  </script>

</body>

</html>
