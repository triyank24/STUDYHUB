<!DOCTYPE html>
<html>

<head>
  <title>StudyHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1c1b2e;
      --purple: #7c6fff;
      --purple2: #a855f7;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(124, 111, 255, 0.18);
      --text: #eeedf8;
      --muted: rgba(255, 255, 255, 0.45);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: var(--text);
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 25%, rgba(124, 111, 255, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 75%, rgba(168, 85, 247, 0.14) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(99, 179, 255, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 9s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% {
        opacity: 0.8;
      }

      100% {
        opacity: 1;
      }
    }

    /* ── Floating study icons ── */
    .study-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .study-bg span {
      position: absolute;
      display: block;
      opacity: 0.28;
      animation: floatIcon linear infinite;
      user-select: none;
      filter: saturate(0.6) brightness(1.3);
    }

    .study-bg span:nth-child(1) {
      left: 4%;
      top: 7%;
      font-size: 38px;
      animation-duration: 18s;
      animation-delay: 0s;
    }

    .study-bg span:nth-child(2) {
      left: 13%;
      top: 63%;
      font-size: 26px;
      animation-duration: 22s;
      animation-delay: -4s;
    }

    .study-bg span:nth-child(3) {
      left: 24%;
      top: 27%;
      font-size: 22px;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    .study-bg span:nth-child(4) {
      left: 41%;
      top: 77%;
      font-size: 34px;
      animation-duration: 20s;
      animation-delay: -2s;
    }

    .study-bg span:nth-child(5) {
      left: 57%;
      top: 11%;
      font-size: 30px;
      animation-duration: 25s;
      animation-delay: -6s;
    }

    .study-bg span:nth-child(6) {
      left: 68%;
      top: 56%;
      font-size: 24px;
      animation-duration: 19s;
      animation-delay: -10s;
    }

    .study-bg span:nth-child(7) {
      left: 78%;
      top: 31%;
      font-size: 36px;
      animation-duration: 23s;
      animation-delay: -3s;
    }

    .study-bg span:nth-child(8) {
      left: 88%;
      top: 71%;
      font-size: 28px;
      animation-duration: 17s;
      animation-delay: -7s;
    }

    .study-bg span:nth-child(9) {
      left: 92%;
      top: 17%;
      font-size: 22px;
      animation-duration: 21s;
      animation-delay: -1s;
    }

    .study-bg span:nth-child(10) {
      left: 8%;
      top: 88%;
      font-size: 32px;
      animation-duration: 24s;
      animation-delay: -5s;
    }

    .study-bg span:nth-child(11) {
      left: 50%;
      top: 47%;
      font-size: 20px;
      animation-duration: 15s;
      animation-delay: -9s;
    }

    .study-bg span:nth-child(12) {
      left: 32%;
      top: 4%;
      font-size: 26px;
      animation-duration: 20s;
      animation-delay: -11s;
    }

    @keyframes floatIcon {
      0% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }

      30% {
        transform: translateY(-18px) rotate(6deg) scale(1.05);
      }

      65% {
        transform: translateY(-7px) rotate(-4deg) scale(0.97);
      }

      100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 56px 52px 52px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(124, 111, 255, 0.12),
        0 40px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(36px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Subtle shimmer border on hover */
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(124, 111, 255, 0.4), rgba(168, 85, 247, 0.2), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: -1;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c6fff, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(124, 111, 255, 0.50);
      animation: logoBounce 3s ease-in-out infinite;
    }

    @keyframes logoBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .logo-text {
      font-family: 'Sora', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.8px;
    }

    /* ── Subtitle ── */
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 40px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Feature pills ── */
    .pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid rgba(124, 111, 255, 0.20);
      background: rgba(124, 111, 255, 0.08);
      color: rgba(255, 255, 255, 0.60);
      font-size: 12px;
      font-weight: 500;
      animation: pillIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .pill:nth-child(1) {
      animation-delay: 0.15s;
    }

    .pill:nth-child(2) {
      animation-delay: 0.25s;
    }

    .pill:nth-child(3) {
      animation-delay: 0.35s;
    }

    @keyframes pillIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 36px;
      border-radius: 14px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.22s ease,
        filter 0.22s ease;
      overflow: hidden;
      min-width: 140px;
    }

    /* Ripple effect on click */
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      opacity: 0;
      border-radius: inherit;
      transition: opacity 0.2s;
    }

    .btn:active::after {
      opacity: 1;
    }

    .btn:active {
      transform: scale(0.96) !important;
    }

    /* Login — outlined glass */
    .btn-primary {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.18);
    }

    .btn-primary:hover {
      transform: translateY(-4px) scale(1.03);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.30);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.30);
    }

    /* Sign Up — gradient filled */
    .btn-secondary {
      background: linear-gradient(135deg, #7c6fff 0%, #a855f7 100%);
      color: #fff;
      box-shadow: 0 8px 28px rgba(124, 111, 255, 0.45);
    }

    .btn-secondary:hover {
      transform: translateY(-4px) scale(1.03);
      filter: brightness(1.12);
      box-shadow: 0 16px 40px rgba(124, 111, 255, 0.55);
    }

    /* Shine sweep on Sign Up hover */
    .btn-secondary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 1s ease;
    }

    .btn-secondary:hover::before {
      left: 160%;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 0;
      color: rgba(0, 0, 0, 0.079);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body>

  <!-- Floating study icons -->
  <div class="study-bg">
    <span>📚</span><span>✏️</span><span>💡</span><span>🎓</span>
    <span>📝</span><span>🔬</span><span>📐</span><span>🖊️</span>
    <span>📓</span><span>⚗️</span><span>🧮</span><span>📏</span>
  </div>

  <div class="card">

    <div class="logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">StudyHub</div>
    </div>

    <p class="subtitle">
      A simple platform to create rooms, share notes,
      and collaborate with video conferencing.
    </p>

    <!-- Feature pills -->
    <div class="pills">
      <span class="pill">📚 Study Rooms</span>
      <span class="pill">📝 Shared Notes</span>
      <span class="pill">🎥 Video Calls</span>
    </div>

    <div class="buttons">
      <button class="btn btn-primary" onclick="location.href='login.html'">
        Login
      </button>
      <button class="btn btn-secondary" onclick="location.href='signup.html'">
        Sign Up
      </button>
    </div>

    <div class="divider">your study space awaits</div>

  </div>

</body>

</html>
